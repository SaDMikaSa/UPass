name: Release Build

on:
  release:
    types: [published]

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64, arm64]
        exclude:
          - os: windows-latest
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.0"
          cache: true

      - name: Run tests
        run: go test -v ./...

      - name: Build binary
        env:
          GOOS: ${{ matrix.os == 'macos-latest' && 'darwin' || matrix.os == 'ubuntu-latest' && 'linux' || 'windows' }}
          GOARCH: ${{ matrix.arch }}
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            BINARY_NAME="upass-windows-${{ matrix.arch }}.exe"
          else
            BINARY_NAME="upass-${{ env.GOOS }}-${{ matrix.arch }}"
          fi

          echo "Building $BINARY_NAME..."
          go build -ldflags="-s -w" -o "$BINARY_NAME" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: upass-${{ matrix.os }}-${{ matrix.arch }}
          path: upass-*

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: upass-*
