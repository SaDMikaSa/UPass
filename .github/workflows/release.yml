name: Release Build

on:
  release:
    types: [published]

jobs:
  build:
    name: Build for ${{ matrix.os }} (${{ matrix.arch }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        arch: [amd64, arm64]
        exclude:
          - os: windows-latest
            arch: arm64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: latest
          args: --timeout=5m

      - name: Run gosec security scanner
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude=G104 -exclude-dir=vendor ./...

      - name: Run tests
        run: go test -v -race ./...

      - name: Build binary
        shell: bash
        env:
          GOOS: ${{ matrix.os == 'macos-latest' && 'darwin' || matrix.os == 'ubuntu-latest' && 'linux' || 'windows' }}
          GOARCH: ${{ matrix.arch }}
        run: |
          # Определяем расширение файла (.exe для Windows)
          EXT=""
          if [ "${{ env.GOOS }}" = "windows" ]; then
            EXT=".exe"
          fi

          BINARY_NAME="upass-${{ env.GOOS }}-${{ matrix.arch }}${EXT}"

          echo "Building $BINARY_NAME..."
          go build -ldflags="-s -w" -o "$BINARY_NAME" .

      - name: Upload release asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: upass-*
